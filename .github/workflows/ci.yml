# Checks for every pull request and every push to main: typecheck, the
# workerd/D1 tests and a deploy dry run. Commit messages are checked by
# commits.yml (release-kit). Deploys run from the owner's machine
# (`npm run deploy`), so this workflow holds no Cloudflare token.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets the release-kit train run it on a release commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, tests, deploy dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:deploy
